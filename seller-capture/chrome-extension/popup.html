<!doctype html>
<html><head><meta charset="utf-8"/>
<style>
  body{font:13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;width:340px;padding:12px;margin:0}
  label{display:block;margin-top:8px;font-weight:600}
  input,select{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font:inherit}
  .help{color:#6b7280;font-size:11px;margin-top:2px}
  .row{display:flex;gap:8px;margin-top:12px}
  button{flex:1;padding:8px 10px;border:0;border-radius:6px;cursor:pointer;font-weight:600}
  .primary{background:#2563eb;color:#fff}
  .secondary{background:#e5e7eb;color:#111}
  .msg{margin-top:8px;font-size:12px}
  .ok{color:#16a34a}.err{color:#dc2626}
  .cluster{background:#ecfdf5;border:1px solid #1f9d55;color:#0b6b3a;padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:12px}
  .cluster.idle{background:#f3f4f6;border-color:#d1d5db;color:#6b7280}
  .cluster b{font-weight:600}
  .cluster button{margin-top:6px;padding:4px 8px;font-size:11px;background:#dc2626;color:#fff;border:0;border-radius:4px;cursor:pointer}
</style></head>
<body>
  <div id="clusterStatus" class="cluster idle">No active cluster. Press <b>Alt+G</b> on a slug-tagged link or an ASIN page to start one.</div>

  <label data-i18n="popup_endpoint"></label>
  <input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec"/>
  <div class="help" data-i18n="popup_endpoint_help"></div>

  <label data-i18n="popup_drive_folder"></label>
  <input id="driveFolderId" type="text" placeholder="1AbCdEf..."/>

  <label>Shared secret (HMAC)</label>
  <input id="sharedSecret" type="password" placeholder="(set in Apps Script Properties → CAPTURE_SHARED_SECRET)"/>

  <label data-i18n="popup_operator_id"></label>
  <input id="operatorId" type="text" placeholder="op1"/>

  <label data-i18n="popup_marketplace_override"></label>
  <input id="marketplaceOverride" type="text" placeholder=""/>

  <label data-i18n="popup_language"></label>
  <select id="lang">
    <option value="en">English</option>
    <option value="pl">Polski</option>
  </select>

  <div class="row">
    <button class="primary" id="save" data-i18n="popup_save"></button>
    <button class="secondary" id="test" data-i18n="popup_test"></button>
  </div>
  <div class="msg" id="msg"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body></html>
